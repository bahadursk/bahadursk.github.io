<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="t d">
<title id="t">Data-driven discovery of emitters and semiconductors</title><desc id="d">A large virtual library of candidate molecules is filtered by computed criteria such as singlet–triplet gap, oscillator strength and emission colour, leaving a few lead emitters for synthesis.</desc>
