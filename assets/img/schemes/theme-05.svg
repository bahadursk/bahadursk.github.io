<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 250" role="img" aria-labelledby="t d">
<title id="t">Triplet management and energy-transfer engineering</title><desc id="d">Energy-level diagram of a donor host and acceptor guest. Singlets cross to the donor triplet, which transfers energy to the acceptor singlet by triplet-to-singlet Förster resonance energy transfer, giving bright emission.</desc>
<defs>
<linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset="1" stop-color="#ffe8f3"/></linearGradient>
<marker id="ar" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#db2777"/></marker>
<marker id="ag" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 Z" fill="#94a3b8"/></marker>
</defs>
<style>text{font-family:Inter,system-ui,-apple-system,Segoe UI,sans-serif;fill:#1e1040}.s{font-size:13px}.xs{font-size:11.5px;fill:#5b4a7a}.b{font-weight:700}.c{fill:#db2777}</style>
<rect width="400" height="250" rx="18" fill="url(#bg)"/>
<rect x=".5" y=".5" width="399" height="249" rx="18" fill="none" stroke="#db2777" stroke-opacity=".22"/>

<text x="20" y="30" class="s b c">Harvesting triplets via energy transfer</text>
<text x="105" y="232" text-anchor="middle" class="xs b">donor (host)</text><text x="305" y="232" text-anchor="middle" class="xs b">acceptor (guest)</text>
<line x1="50" y1="208" x2="160" y2="208" stroke="#1e1040" stroke-width="2.5"/><line x1="250" y1="208" x2="360" y2="208" stroke="#1e1040" stroke-width="2.5"/>
<line x1="50" y1="62" x2="100" y2="62" stroke="#7c3aed" stroke-width="3"/><text x="44" y="66" text-anchor="end" class="xs b">S₁</text>
<line x1="115" y1="98" x2="165" y2="98" stroke="#db2777" stroke-width="3"/><text x="140" y="90" text-anchor="middle" class="s b c">T₁</text>
<line x1="250" y1="120" x2="310" y2="120" stroke="#7c3aed" stroke-width="3"/><text x="280" y="112" text-anchor="middle" class="xs b">S₁</text>
<line x1="320" y1="150" x2="362" y2="150" stroke="#94a3b8" stroke-width="2"/><text x="370" y="154" class="xs">T₁</text>
<line x1="75" y1="205" x2="75" y2="68" stroke="#7c3aed" stroke-width="2" marker-end="url(#ar)" opacity=".6"/>
<path d="M100,64 C112,66 118,80 125,94" fill="none" stroke="#64748b" stroke-width="1.6" marker-end="url(#ag)"/><text x="122" y="70" class="xs">ISC</text>
<path d="M168,98 C210,92 230,110 246,118" fill="none" stroke="#db2777" stroke-width="3" marker-end="url(#ar)"/>
<text x="205" y="88" text-anchor="middle" class="xs b c">TS-FRET</text>
<line x1="280" y1="124" x2="280" y2="204" stroke="#f59e0b" stroke-width="3" marker-end="url(#ar)"/>
<path d="M290,180 q5,-6 10,0 t10,0 t10,0" fill="none" stroke="#f59e0b" stroke-width="2"/><text x="318" y="186" class="xs b" style="fill:#b45309">bright</text><text x="318" y="200" class="xs b" style="fill:#b45309">afterglow</text>
</svg>
